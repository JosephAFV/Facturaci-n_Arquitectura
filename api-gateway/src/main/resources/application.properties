spring.application.name=api-gateway
server.port=${SERVER-PORT:3000}

# Clientes
spring.cloud.gateway.server.webflux.routes[0].id=servicio-cliente
spring.cloud.gateway.server.webflux.routes[0].uri=${CLIENTE_SERVICIO_URL:http://localhost:3001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**

# Productos
spring.cloud.gateway.server.webflux.routes[1].id=servicio-producto
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCTO_SERVICIO_URL:http://localhost:3002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

# Facturas
spring.cloud.gateway.server.webflux.routes[2].id=servicio-facturas
spring.cloud.gateway.server.webflux.routes[2].uri=${FACTURA_SERVICIO_URL:http://localhost:3003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/facturas/**

# Permitir las peticiones desde Hoppscotch
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=https://hoppscotch.io
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# Evitar encabezados CORS duplicados entre gateway y servicios
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin