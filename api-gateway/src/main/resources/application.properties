spring.application.name=api-gateway
server.port=3000



#Servicio cliente
spring.cloud.gateway.server.webflux.routes[0].id=servicio-cliente
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:3001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**


#Servicio Producto
spring.cloud.gateway.server.webflux.routes[0].id=servicio-producto
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:3002
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/productos/**


#Servicio Facturas
spring.cloud.gateway.server.webflux.routes[0].id=servicio-facturas
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:3003
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/facturas/**