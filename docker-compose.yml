services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: cliente
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data
    networks:
      - microservices-networks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cliente"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s